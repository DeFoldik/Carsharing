spring.application.name=carsharing

spring.datasource.url=jdbc:mysql://localhost:3306/carsharing?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.file.name=logs/app.log
logging.level.org.example.aspect=INFO
logging.level.org.example.service=INFO
logging.level.org.example.controller=INFO
logging.pattern.file=%d{dd-MM-yyyy HH:mm:ss} [%level] - %msg%n
spring.application.name=carsharing

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.file.name=logs/app.log
logging.level.org.example.aspect=INFO
logging.level.org.example.service=INFO
logging.level.org.example.controller=INFO
logging.pattern.file=%d{dd-MM-yyyy HH:mm:ss} [%level] - %msg%n

